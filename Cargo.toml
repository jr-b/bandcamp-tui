[package]
name = "bandcamp-tui"
version = "0.1.0"
edition = "2024"
# stream-download (milestone 3) requires 1.91.
rust-version = "1.91"
description = "A terminal player for browsing Bandcamp Discover and streaming full albums"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jr-b/bandcamp-rust-tui"
readme = "README.md"
keywords = ["bandcamp", "tui", "music", "player", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls", "http2", "query"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noisy for an application crate.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints we opt into.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6.5"
