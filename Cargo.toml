[package]
name = "bandcamp-tui"
version = "0.1.0"
edition = "2024"
# stream-download (milestone 3) requires 1.91.
rust-version = "1.91"
description = "A terminal player for browsing Bandcamp Discover and streaming full albums"
license = "CC-BY-NC-4.0"
repository = "https://github.com/jr-b/bandcamp-rust-tui"
readme = "README.md"
keywords = ["bandcamp", "tui", "music", "player", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noisy for an application crate.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints we opt into.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
