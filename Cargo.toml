[package]
name = "bandcamp-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A terminal player for browsing Bandcamp Discover and streaming full albums"
license = "CC-BY-NC-4.0"
repository = "https://github.com/jr-b/bandcamp-rust-tui"
readme = "README.md"
keywords = ["bandcamp", "tui", "music", "player", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
# Only to enable `event-stream`; code imports it as `ratatui::crossterm`, the version ratatui uses.
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls", "http2", "query"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
url = { version = "2.5.8", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noisy for an application crate.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints we opt into.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Lint exceptions use `#[expect(..., reason = "...")]`, so stale ones are reported.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
insta = "1.49.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
